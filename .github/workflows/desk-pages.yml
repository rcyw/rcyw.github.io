name: Desk Pages
run-name: ${{ inputs.desk_sha && format('Desk Pages · {0}', inputs.desk_sha) || 'Preview Desk Pages' }}

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desk-pages.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      desk_sha:
        description: Commit at the head of rcyw/desk main
        required: true
        type: string
      publish:
        description: Deploy the verified build to GitHub Pages
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      desk_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: rcyw/desk
          ref: refs/heads/main
          persist-credentials: false
      - name: Resolve the Desk revision
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.desk_sha }}
        shell: bash
        run: |
          desk_sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REQUESTED_SHA" != "$desk_sha" ]]; then
            echo 'The requested commit must be the current Desk main.'
            exit 1
          fi
          echo "sha=$desk_sha" >> "$GITHUB_OUTPUT"
          echo "Desk source: $desk_sha"
      - name: Verify the Desk CI result
        env:
          DESK_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 3 --get \
            https://api.github.com/repos/rcyw/desk/actions/workflows/ci.yml/runs \
            --data-urlencode branch=main --data-urlencode event=push \
            --data-urlencode "head_sha=$DESK_SHA" \
            --data-urlencode status=success --data-urlencode per_page=1 |
            jq -e --arg sha "$DESK_SHA" 'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")'
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify the static output
        env:
          DESK_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/404.html
          echo "$DESK_SHA" > dist/desk-revision.txt
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish &&
      vars.PAGES_SOURCE == 'desk'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm Desk main is still current
        env:
          DESK_SHA: ${{ needs.build.outputs.desk_sha }}
        shell: bash
        run: |
          latest_sha=$(git ls-remote https://github.com/rcyw/desk.git refs/heads/main | cut -f1)
          if [[ "$DESK_SHA" != "$latest_sha" ]]; then
            echo 'A newer Desk commit superseded this build.'
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verify the published revision
        env:
          DESK_SHA: ${{ needs.build.outputs.desk_sha }}
        shell: bash
        run: |
          for attempt in {1..6}; do
            if [[ "$(curl -fsS --max-time 10 "https://rcyw.github.io/desk-revision.txt?sha=$DESK_SHA")" == "$DESK_SHA" ]]; then
              exit 0
            fi
            echo "Waiting for Pages to serve the expected revision ($attempt/6)."
            sleep 5
          done
          echo "Pages did not serve Desk revision $DESK_SHA."
          exit 1
